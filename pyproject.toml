[project]
name = "flux"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi==0.122.0",
    "uvicorn==0.38.0",
    "psycopg2-binary==2.9.11",
    "pandas==2.3.3",
    "jinja2==3.1.6",
    "dramatiq[redis]==2.0.0",
    "numpy==2.3.5",
    "scipy==1.16.3",
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    "prophet==1.2.1",
    "statsmodels==0.14.5",
    "streamlit==1.51.0",
    "passlib==1.7.4",
    "bcrypt==5.0.0",
    "itsdangerous==2.2.0",
    "argon2-cffi==25.1.0",
    "slowapi==0.1.9",
    "python-multipart==0.0.20",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "pytest-timeout>=2.1.0",
    "pytest-xdist>=3.3.1",
    "httpx>=0.24.0",
    "faker>=19.0.0",
]

dev = [
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    "bandit[toml]>=1.7.5",
    "pre-commit>=3.4.0",
]

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101"]

[tool.mypy]
python_version = "3.11"

warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
plugins = []

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
