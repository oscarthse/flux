version: '3.8'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flux
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../schema.sql:/docker-entrypoint-initdb.d/schema.sql

  redis:
    image: redis:7
    ports:
      - "6380:6379"

  api:
    build:
      context: ../../
      dockerfile: infrastructure/local/Dockerfile.api
    command: uvicorn services.api.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ../../services:/app/services
      - ../../lib:/app/lib
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/flux
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  worker:
    build:
      context: ../../
      dockerfile: infrastructure/local/Dockerfile.worker
    command: dramatiq services.worker.tasks --processes 2 --threads 2 --watch .
    volumes:
      - ../../services:/app/services
      - ../../lib:/app/lib
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/flux
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
