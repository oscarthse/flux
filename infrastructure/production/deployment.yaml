apiVersion: apps/v1
kind: Deployment
metadata:
  name: flux-api
  namespace: default
  labels:
    app: flux-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: flux-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: flux-api
    spec:
      containers:
      - name: api
        image: europe-west9-docker.pkg.dev/flux-480317/flux-repo/flux-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: flux-secrets
              key: database-url
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: flux-secrets
              key: secret-key
        - name: ENVIRONMENT
          value: "production"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          successThreshold: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flux-worker
  namespace: default
  labels:
    app: flux-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flux-worker
  template:
    metadata:
      labels:
        app: flux-worker
    spec:
      # Isolate worker to high-CPU nodes
      # nodeSelector:
      #   workload: compute-intensive
      tolerations:
      - key: "dedicated"
        operator: "Equal"
        value: "compute"
        effect: "NoSchedule"
      containers:
      - name: worker
        image: europe-west9-docker.pkg.dev/flux-480317/flux-repo/flux-api:latest
        command: ["python", "services/worker/run_worker.py"]
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: flux-secrets
              key: database-url
        - name: ENVIRONMENT
          value: "production"
        resources:
          requests:
            memory: "1Gi"
            cpu: "1000m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
