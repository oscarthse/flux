name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: flux_test
          POSTGRES_USER: flux
          POSTGRES_PASSWORD: flux_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ".[test]"

    - name: Run Unit Tests
      env:
        DATABASE_URL: postgresql://flux:flux_password@localhost:5432/flux_test
        REDIS_URL: redis://localhost:6379/0
        DEFAULT_TENANT_ID: a73ba506-b078-42b3-91f6-fd168c958ee2
        PYTHONPATH: .
      run: |
        pytest tests/unit --cov=services --cov-report=xml


    - name: Run Integration Tests
      env:
        DATABASE_URL: postgresql://flux:flux_password@localhost:5432/flux_test
        REDIS_URL: redis://localhost:6379/0
        DEFAULT_TENANT_ID: a73ba506-b078-42b3-91f6-fd168c958ee2
        PYTHONPATH: .
        PGPASSWORD: flux_password
        POSTGRES_HOST: localhost
        POSTGRES_PORT: 5432
        POSTGRES_USER: flux
        POSTGRES_PASSWORD: flux_password

      run: |
        # Install postgresql-client to use psql
        sudo apt-get update
        sudo apt-get install -y postgresql-client

        # Initialize DB schema
        psql -h localhost -U flux -d flux_test -f schema.sql

        # Create application user (non-superuser) for RLS testing
        psql -h localhost -U flux -d flux_test -c "CREATE USER flux_app WITH PASSWORD 'flux_pass';"
        psql -h localhost -U flux -d flux_test -c "GRANT ALL PRIVILEGES ON DATABASE flux_test TO flux_app;"
        psql -h localhost -U flux -d flux_test -c "GRANT ALL ON SCHEMA public TO flux_app;"
        psql -h localhost -U flux -d flux_test -c "GRANT ALL ON ALL TABLES IN SCHEMA public TO flux_app;"
        psql -h localhost -U flux -d flux_test -c "GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO flux_app;"

        # Run tests
        pytest tests/integration



    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
