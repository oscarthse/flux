{% extends "base.html" %}

{% block content %}
<div class="h-[calc(100vh-4rem)] flex overflow-hidden bg-slate-50">

  <!-- Sidebar: Master List -->
  <div class="w-80 flex-shrink-0 border-r border-slate-200 bg-white flex flex-col" x-data="{ search: '' }">
    <div class="p-4 border-b border-slate-100">
      <h2 class="text-lg font-semibold text-slate-800 mb-3">Menu Registry</h2>
      <div class="relative">
        <input type="text" x-model="search" placeholder="Search menu items..."
          class="w-full pl-9 pr-3 py-2 text-sm border border-slate-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
        <svg class="w-4 h-4 text-slate-400 absolute left-3 top-2.5" fill="none" stroke="currentColor"
          viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      </div>
    </div>

    <div class="flex-1 overflow-y-auto">
      <ul class="divide-y divide-slate-100">
        {% for item in menu_items %}
        <li x-show="!search || '{{ item.name|lower }}'.includes(search.toLowerCase())">
          <button hx-get="/menu/{{ item.id }}" hx-target="#detail-panel" hx-swap="innerHTML"
            @click="$el.querySelectorAll('li').forEach(el => el.classList.remove('bg-blue-50')); $el.closest('li').classList.add('bg-blue-50')"
            class="w-full text-left px-4 py-3 hover:bg-slate-50 focus:outline-none transition-colors group">
            <div class="flex justify-between items-center">
              <span class="font-medium text-slate-700 group-hover:text-blue-600">{{ item.name }}</span>
              <span class="text-xs font-medium text-slate-500 bg-slate-100 px-2 py-0.5 rounded-full">{{ item.category
                }}</span>
            </div>
            <div class="mt-1 text-xs text-slate-400">${{ "%.2f"|format(item.price) }}</div>
          </button>
        </li>
        {% endfor %}
      </ul>
    </div>
  </div>

  <!-- Main Content: Detail Panel -->
  <div id="detail-panel" class="flex-1 overflow-y-auto p-8">
    <!-- Placeholder State -->
    <div class="h-full flex flex-col items-center justify-center text-slate-400">
      <svg class="w-16 h-16 mb-4 text-slate-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
          d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
      </svg>
      <p class="text-lg font-medium text-slate-500">Select a menu item to view details</p>
      <p class="text-sm mt-2">View sales performance and ingredient audit trail</p>
    </div>
  </div>

</div>
{% endblock %}
