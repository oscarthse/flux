{% extends "base.html" %}

{% block title %}Smart Order - Flux{% endblock %}

{% block content %}
<div class="space-y-6">
  <div class="flex justify-between items-center">
    <h1 class="text-2xl font-bold text-gray-900">Smart Order</h1>
    <div class="flex items-center gap-4">
      <div class="htmx-indicator" id="optimization-spinner">
        <svg class="animate-spin h-5 w-5 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none"
          viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
          </path>
        </svg>
      </div>
      <button hx-post="/inventory/generate" hx-target="#po-list" hx-swap="innerHTML"
        hx-indicator="#optimization-spinner"
        class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 disabled:opacity-50">
        Run Optimization Now
      </button>
    </div>
  </div>

  <div id="po-list" class="space-y-6">
    {% include "components/po_list.html" %}
  </div>
</div>
{% endblock %}
