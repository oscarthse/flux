{% extends "base.html" %}

{% block title %}Smart Inventory - Flux Platform{% endblock %}

{% block content %}
<div x-data="{ approving: false, generating: false }" class="h-full flex flex-col overflow-hidden">

  <!-- Top Control Bar -->
  <header class="bg-white border-b border-slate-200 px-8 py-4 flex-shrink-0">
    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">Smart Ordering</h1>
        <p class="text-sm text-slate-500 mt-0.5">We did the math. Here's what you need to buy.</p>
      </div>
      <div class="flex items-center space-x-4">
        <button @click="generating = true" hx-post="/inventory/generate" hx-target="#po-list" hx-swap="innerHTML"
          :disabled="generating"
          class="px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:opacity-50 transition-colors flex items-center space-x-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
          <span x-text="generating ? 'Generating...' : 'Generate Orders'"></span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <div class="flex-1 overflow-auto p-8">
    <div id="po-list" class="max-w-7xl mx-auto space-y-6">

      <!-- Initial Load -->
      <div hx-get="/inventory/smart-order-list" hx-trigger="load" hx-swap="outerHTML">
        <div class="bg-white rounded-lg shadow-sm p-12 text-center">
          <div class="w-16 h-16 mx-auto mb-4 bg-slate-100 rounded-lg animate-pulse"></div>
          <p class="text-sm text-slate-500">Loading purchase orders...</p>
        </div>
      </div>

    </div>
  </div>

</div>
{% endblock %}
