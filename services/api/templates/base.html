<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flux Triage Room</title>
  <script src="https://unpkg.com/htmx.org@1.9.6"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 font-sans leading-normal tracking-normal">
  <nav class="bg-gray-800 p-4 text-white">
    <div class="container mx-auto flex justify-between items-center">
      <a href="/" class="font-bold text-xl">Flux Platform</a>
      <div>
        <a href="/analytics/forecasts" class="block px-4 py-2 rounded hover:bg-gray-700">Forecasting</a>
        <a href="/inventory/smart-order" class="block px-4 py-2 rounded hover:bg-gray-700">Smart Order</a>
        <span class="text-sm text-gray-400">Tenant: {{ tenant_name }}</span>
      </div>
    </div>
  </nav>

  <div class="container mx-auto mt-8 p-4">
    {% block content %}{% endblock %}
  </div>
</body>

</html>
