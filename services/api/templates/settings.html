{% extends "base.html" %}

{% block content %}
<div class="max-w-4xl mx-auto py-8 px-4 sm:px-6 lg:px-8">

  <!-- Header -->
  <div class="mb-8">
    <h1 class="text-2xl font-bold text-slate-900">Settings Control Panel</h1>
    <p class="mt-1 text-sm text-slate-500">Configure the underlying logic and policies of your Flux platform.</p>
  </div>

  <!-- Reusable Tooltip Component -->
  <template id="tooltip-icon">
    <div class="group relative inline-block ml-1.5 align-middle"
      x-data="{ text: $el.parentElement.getAttribute('data-tooltip') }">
      <svg class="w-4 h-4 text-slate-400 cursor-help hover:text-blue-500 transition-colors" fill="none"
        stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <div
        class="absolute bottom-full left-1/2 transform -translate-x-1/2 mb-2 w-96 p-4 bg-slate-800 text-white text-xs rounded-lg shadow-lg opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50 text-center pointer-events-none leading-relaxed">
        <span x-text="text"></span>
        <div
          class="absolute top-full left-1/2 transform -translate-x-1/2 -mt-1 border-4 border-transparent border-t-slate-800">
        </div>
      </div>
    </div>
  </template>

  <div class="space-y-6" x-data="{ activeTab: 'forecasting' }">

    <!-- 1. Forecasting & Data Integrity -->
    <div class="bg-white shadow-sm rounded-lg border border-slate-200 overflow-hidden">
      <button @click="activeTab = activeTab === 'forecasting' ? null : 'forecasting'"
        class="w-full px-6 py-4 flex items-center justify-between bg-slate-50 hover:bg-slate-100 transition-colors focus:outline-none">
        <div class="flex items-center gap-3">
          <div class="p-2 bg-purple-100 rounded-lg text-purple-600">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
            </svg>
          </div>
          <div class="text-left">
            <h2 class="text-lg font-medium text-slate-900">Forecasting & Data Integrity</h2>
            <p class="text-xs text-slate-500">Control the forecasting engine's inputs and freshness</p>
          </div>
        </div>
        <svg class="w-5 h-5 text-slate-400 transform transition-transform duration-200"
          :class="{ 'rotate-180': activeTab === 'forecasting' }" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
      </button>

      <div x-show="activeTab === 'forecasting'" x-collapse class="border-t border-slate-200">
        <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-6">

          <!-- Default Model -->
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">
              Default Model
              <span
                data-tooltip="This setting determines which mathematical method we use to predict your future sales. 'Prophet' is designed to understand complex patterns like holidays and seasons, making it great for most restaurants. 'Moving Average' is simpler and just looks at recent trends to smooth out day-to-day bumps."
                x-html="document.getElementById('tooltip-icon').innerHTML"></span>
            </label>
            <select name="value" hx-patch="/settings/update" hx-vals='{"field": "forecasting_model"}'
              hx-target="#status-model"
              class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-slate-300 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm rounded-md">
              <option value="prophet" {% if settings.forecasting_model=='prophet' %}selected{% endif %}>Prophet
                (Recommended)</option>
              <option value="moving_average" {% if settings.forecasting_model=='moving_average' %}selected{% endif %}>
                Moving Average</option>
            </select>
            <div id="status-model" class="mt-1 h-5 text-sm"></div>
          </div>

          <!-- Prediction Horizon -->
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">
              Prediction Horizon (Days)
              <span
                data-tooltip="This tells the system how far into the future to look when suggesting orders. A 30-day horizon is standard and helps you plan monthly budgets. Shorter horizons (like 7 days) keep things tighter but might miss upcoming busy periods, while longer ones help with long-term planning."
                x-html="document.getElementById('tooltip-icon').innerHTML"></span>
            </label>
            <input type="number" name="value" value="{{ settings.prediction_horizon_days }}" hx-patch="/settings/update"
              hx-vals='{"field": "prediction_horizon_days"}' hx-trigger="change" hx-target="#status-horizon"
              class="mt-1 block w-full border-slate-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
            <div id="status-horizon" class="mt-1 h-5 text-sm"></div>
          </div>

          <!-- Historical Lookback -->
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">
              Historical Lookback (Days)
              <span
                data-tooltip="This controls how much past data we analyze to find patterns. We recommend 365 days so the system can 'remember' what happened this time last year (like holiday rushes). Using less data makes the system react faster to recent changes but it might forget annual trends."
                x-html="document.getElementById('tooltip-icon').innerHTML"></span>
            </label>
            <input type="number" name="value" value="{{ settings.historical_lookback_days }}"
              hx-patch="/settings/update" hx-vals='{"field": "historical_lookback_days"}' hx-trigger="change"
              hx-target="#status-lookback"
              class="mt-1 block w-full border-slate-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
            <div id="status-lookback" class="mt-1 h-5 text-sm"></div>
          </div>

          <!-- Data Recency Alert -->
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">
              Data Recency Alert (Days)
              <span
                data-tooltip="We need fresh data to make good predictions. If your sales data is older than this number of days (e.g., 3 days), we'll warn you. This prevents the system from making suggestions based on old news, ensuring your orders match what's actually happening in the restaurant right now."
                x-html="document.getElementById('tooltip-icon').innerHTML"></span>
            </label>
            <input type="number" name="value" value="{{ settings.data_recency_alert_days }}" hx-patch="/settings/update"
              hx-vals='{"field": "data_recency_alert_days"}' hx-trigger="change" hx-target="#status-recency"
              class="mt-1 block w-full border-slate-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
            <div id="status-recency" class="mt-1 h-5 text-sm"></div>
          </div>

        </div>
      </div>
    </div>

    <!-- 2. Inventory & Procurement Policy -->
    <div class="bg-white shadow-sm rounded-lg border border-slate-200 overflow-hidden">
      <button @click="activeTab = activeTab === 'inventory' ? null : 'inventory'"
        class="w-full px-6 py-4 flex items-center justify-between bg-slate-50 hover:bg-slate-100 transition-colors focus:outline-none">
        <div class="flex items-center gap-3">
          <div class="p-2 bg-emerald-100 rounded-lg text-emerald-600">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
            </svg>
          </div>
          <div class="text-left">
            <h2 class="text-lg font-medium text-slate-900">Inventory & Procurement Policy</h2>
            <p class="text-xs text-slate-500">Define safety nets and financial constraints</p>
          </div>
        </div>
        <svg class="w-5 h-5 text-slate-400 transform transition-transform duration-200"
          :class="{ 'rotate-180': activeTab === 'inventory' }" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
      </button>

      <div x-show="activeTab === 'inventory'" x-collapse class="border-t border-slate-200">
        <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-6">

          <!-- Safety Stock Buffer -->
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">
              Safety Stock Buffer (%)
              <span
                data-tooltip="If set to 50%, the system orders 1.5x the quantity needed during your supplier's lead time to handle demand spikes."
                x-html="document.getElementById('tooltip-icon').innerHTML"></span>
            </label>
            <div class="flex items-center gap-4">
              <input type="range" min="0" max="100" step="5" name="value"
                value="{{ settings.safety_stock_buffer_percent }}" hx-patch="/settings/update"
                hx-vals='{"field": "safety_stock_buffer_percent"}' hx-trigger="change" hx-target="#status-safety"
                oninput="this.nextElementSibling.value = this.value + '%'"
                class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer">
              <output class="text-sm font-mono text-slate-600 w-12 text-right">{{ settings.safety_stock_buffer_percent
                }}%</output>
            </div>
            <div id="status-safety" class="mt-1 h-5 text-sm"></div>
          </div>

          <!-- Order Cycle Target -->
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">
              Order Cycle Target (Days)
              <span
                data-tooltip="The system will suggest ordering enough product to keep stock healthy for this many days after the delivery arrives (e.g., 7 days)."
                x-html="document.getElementById('tooltip-icon').innerHTML"></span>
            </label>
            <input type="number" name="value" value="{{ settings.order_cycle_target_days }}" hx-patch="/settings/update"
              hx-vals='{"field": "order_cycle_target_days"}' hx-trigger="change" hx-target="#status-cycle"
              class="mt-1 block w-full border-slate-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
            <div id="status-cycle" class="mt-1 h-5 text-sm"></div>
          </div>

          <!-- Default Lead Time -->
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">
              Default Lead Time (Days)
              <span
                data-tooltip="This is the core metric for calculating your Run-Out Date. This can be overridden per supplier."
                x-html="document.getElementById('tooltip-icon').innerHTML"></span>
            </label>
            <input type="number" name="value" value="{{ settings.default_lead_time_days }}" hx-patch="/settings/update"
              hx-vals='{"field": "default_lead_time_days"}' hx-trigger="change" hx-target="#status-lead"
              class="mt-1 block w-full border-slate-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
            <div id="status-lead" class="mt-1 h-5 text-sm"></div>
          </div>

          <!-- Financial Risk Threshold -->
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">
              Financial Risk Threshold ($)
              <span
                data-tooltip="Any single purchase order exceeding this amount will be flagged for review to prevent large erroneous orders."
                x-html="document.getElementById('tooltip-icon').innerHTML"></span>
            </label>
            <div class="relative rounded-md shadow-sm">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <span class="text-slate-500 sm:text-sm">$</span>
              </div>
              <input type="number" name="value" value="{{ settings.financial_risk_threshold }}"
                hx-patch="/settings/update" hx-vals='{"field": "financial_risk_threshold"}' hx-trigger="change"
                hx-target="#status-risk"
                class="focus:ring-blue-500 focus:border-blue-500 block w-full pl-7 pr-12 sm:text-sm border-slate-300 rounded-md">
            </div>
            <div id="status-risk" class="mt-1 h-5 text-sm"></div>
          </div>

        </div>
      </div>
    </div>

    <!-- 3. User & System Management -->
    <div class="bg-white shadow-sm rounded-lg border border-slate-200 overflow-hidden">
      <button @click="activeTab = activeTab === 'system' ? null : 'system'"
        class="w-full px-6 py-4 flex items-center justify-between bg-slate-50 hover:bg-slate-100 transition-colors focus:outline-none">
        <div class="flex items-center gap-3">
          <div class="p-2 bg-slate-100 rounded-lg text-slate-600">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
          </div>
          <div class="text-left">
            <h2 class="text-lg font-medium text-slate-900">User & System Management</h2>
            <p class="text-xs text-slate-500">General account and environment configuration</p>
          </div>
        </div>
        <svg class="w-5 h-5 text-slate-400 transform transition-transform duration-200"
          :class="{ 'rotate-180': activeTab === 'system' }" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
      </button>

      <div x-show="activeTab === 'system'" x-collapse class="border-t border-slate-200">
        <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-6">

          <!-- Timezone -->
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">
              Tenant Timezone
              <span data-tooltip="Local timezone for accurate timestamp logging and scheduling."
                x-html="document.getElementById('tooltip-icon').innerHTML"></span>
            </label>
            <select name="value" hx-patch="/settings/update" hx-vals='{"field": "timezone"}'
              hx-target="#status-timezone"
              class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-slate-300 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm rounded-md">
              <option value="UTC" {% if settings.timezone=='UTC' %}selected{% endif %}>UTC</option>
              <option value="America/New_York" {% if settings.timezone=='America/New_York' %}selected{% endif %}>Eastern
                Time (US & Canada)</option>
              <option value="America/Chicago" {% if settings.timezone=='America/Chicago' %}selected{% endif %}>Central
                Time (US & Canada)</option>
              <option value="America/Denver" {% if settings.timezone=='America/Denver' %}selected{% endif %}>Mountain
                Time (US & Canada)</option>
              <option value="America/Los_Angeles" {% if settings.timezone=='America/Los_Angeles' %}selected{% endif %}>
                Pacific Time (US & Canada)</option>
              <option value="Europe/London" {% if settings.timezone=='Europe/London' %}selected{% endif %}>London
              </option>
              <option value="Europe/Paris" {% if settings.timezone=='Europe/Paris' %}selected{% endif %}>Paris</option>
            </select>
            <div id="status-timezone" class="mt-1 h-5 text-sm"></div>
          </div>

          <!-- Password/Access -->
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">
              Password & Access
              <span data-tooltip="Manage user roles and change account credentials."
                x-html="document.getElementById('tooltip-icon').innerHTML"></span>
            </label>
            <div class="mt-1">
              <a href="/account"
                class="inline-flex items-center px-4 py-2 border border-slate-300 shadow-sm text-sm font-medium rounded-md text-slate-700 bg-white hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                Manage Account
              </a>
            </div>
          </div>

        </div>
      </div>
    </div>

  </div>
</div>
{% endblock %}
